<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>한신우동 메뉴 카드 뒤집기</title>
<style>
:root{--bg:#f8f7f5;--surface:#fff;--ink:#292824;--muted:#77756f;--line:#e8e6e1;--accent:#a33a24;--accent-soft:#f7e9e5;--good:#3e805b;--shadow:0 5px 18px rgba(47,35,24,.07)}
@media(prefers-color-scheme:dark){:root{--bg:#191919;--surface:#232321;--ink:#f7f6f3;--muted:#b3b1ab;--line:#393936;--accent:#f09376;--accent-soft:#402923;--good:#77bd91;--shadow:0 5px 18px rgba(0,0,0,.2)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;font-size:15px;line-height:1.45}
.shell{max-width:940px;margin:0 auto;padding:24px 28px 28px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:16px}.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:750;margin:0 0 5px}h1{font-size:clamp(23px,4vw,32px);line-height:1.15;letter-spacing:-.04em;margin:0 0 6px}.sub{margin:0;color:var(--muted);font-size:14px}.reset{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;min-height:44px;white-space:nowrap;cursor:pointer;transition:background .15s,border .15s}.reset:hover{border-color:var(--accent);background:var(--accent-soft)}
.controls{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:16px 0 12px;flex-wrap:wrap}.levels{display:flex;gap:7px;flex-wrap:wrap}.level{min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--muted);font:inherit;font-size:13px;font-weight:700;cursor:pointer}.level[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}.stats{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}.stat{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px;min-width:78px;text-align:center}.stat b{color:var(--ink);font-size:15px;margin-left:5px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;perspective:900px}.card{position:relative;aspect-ratio:1.27;border:0;padding:0;background:transparent;cursor:pointer;perspective:900px;border-radius:12px;min-width:0;outline:none}.card:focus-visible{box-shadow:0 0 0 3px var(--accent)}.card-inner{position:absolute;inset:0;border-radius:12px;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.2,.7,.2,1)}.card.is-open .card-inner,.card.is-matched .card-inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;overflow:hidden;border-radius:12px;border:1px solid var(--line);backface-visibility:hidden;box-shadow:var(--shadow)}.back{display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,var(--surface),var(--accent-soft));color:var(--accent)}.back::before{content:"";position:absolute;inset:8px;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:8px}.backmark{font-size:clamp(25px,4vw,42px);font-weight:800;opacity:.9;transform:rotate(-9deg)}.front{transform:rotateY(180deg);background:var(--surface)}.front img{width:100%;height:100%;object-fit:cover;display:block}.caption{position:absolute;inset:auto 0 0;padding:18px 8px 7px;color:#fff;font-size:clamp(11px,1.7vw,14px);font-weight:750;text-align:center;letter-spacing:-.02em;background:linear-gradient(transparent,rgba(25,19,15,.74))}.card.is-matched .face{border-color:var(--good)}.card.is-matched .front img{filter:saturate(.82)}.card.is-matched .caption::after{content:"  ✓";color:#b8f0c7}
.note{display:flex;justify-content:space-between;gap:12px;margin-top:12px;color:var(--muted);font-size:12px}.note strong{color:var(--ink)}.veil{position:fixed;inset:0;display:none;place-items:center;background:rgba(22,19,17,.55);padding:20px;z-index:2}.veil.show{display:grid}.dialog{width:min(100%,360px);padding:28px;border-radius:16px;background:var(--surface);text-align:center;box-shadow:0 18px 70px rgba(0,0,0,.25)}.dialog .emoji{font-size:36px}.dialog h2{font-size:24px;margin:8px 0 4px}.dialog p{color:var(--muted);margin:0 0 20px}.dialog .reset{width:100%;background:var(--accent);color:#fff;border-color:var(--accent)}
@media(max-width:560px){.shell{padding:18px 16px 22px}.top{gap:8px}.reset{padding:8px 10px;font-size:13px}.controls{align-items:flex-start;margin-top:14px}.levels{gap:6px}.level{padding:7px 9px;font-size:12px}.stats{width:100%;justify-content:space-between}.stat{flex:1}.board{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.card{aspect-ratio:1.1;border-radius:10px}.face,.card-inner{border-radius:10px}.caption{font-size:11px;padding:16px 4px 6px}.note{font-size:11px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;scroll-behavior:auto!important}}

const board=document.querySelector('#board'),movesEl=document.querySelector('#moves'),foundEl=document.querySelector('#found'),timeEl=document.querySelector('#time'),feedback=document.querySelector('#feedback'),veil=document.querySelector('#veil');
let pairCount=6,moves=0,found=0,opened=[],locked=false,seconds=0,ticker=null,started=false;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function stopClock(){clearInterval(ticker);ticker=null}
function startClock(){if(started)return;started=true;ticker=setInterval(()=>{seconds++;timeEl.textContent=fmt(seconds)},1000)}
function newGame(){stopClock();started=false;seconds=0;moves=0;found=0;opened=[];locked=false;timeEl.textContent='00:00';movesEl.textContent='0';foundEl.textContent=`0/${pairCount}`;feedback.textContent='준비됐나요?';veil.classList.remove('show');const selected=shuffle([...MENU]).slice(0,pairCount);const deck=shuffle(selected.flatMap((item,id)=>[{...item,id},{...item,id}]));board.innerHTML='';for(const item of deck){const card=document.createElement('button');card.className='card';card.type='button';card.setAttribute('aria-label','숨겨진 메뉴 카드');card.dataset.id=String(item.id);card.innerHTML=`<span class="card-inner"><span class="face back" aria-hidden="true"><span class="backmark">辛</span></span><span class="face front"><img alt="${item.name}" src="${item.src}"><span class="caption">${item.name}</span></span></span>`;card.addEventListener('click',()=>flip(card,item));board.appendChild(card)}}
function flip(card,item){if(locked||card.classList.contains('is-open')||card.classList.contains('is-matched'))return;startClock();card.classList.add('is-open');card.setAttribute('aria-label',item.name);opened.push({card,item});if(opened.length<2)return;moves++;movesEl.textContent=String(moves);const [a,b]=opened;if(a.item.id===b.item.id){a.card.classList.add('is-matched');b.card.classList.add('is-matched');a.card.disabled=true;b.card.disabled=true;found++;foundEl.textContent=`${found}/${pairCount}`;opened=[];feedback.textContent='정답이에요!';if(found===pairCount){stopClock();document.querySelector('#result').textContent=`${moves}번 만에 찾았어요 · ${fmt(seconds)}`;setTimeout(()=>veil.classList.add('show'),450)}}else{locked=true;feedback.textContent='다시 기억해두세요';setTimeout(()=>{for(const x of [a,b]){x.card.classList.remove('is-open');x.card.setAttribute('aria-label','숨겨진 메뉴 카드')}opened=[];locked=false;feedback.textContent='다음 메뉴를 찾아볼까요?'},900)}}
document.querySelectorAll('.level').forEach(btn=>btn.addEventListener('click',()=>{pairCount=Number(btn.dataset.pairs);document.querySelectorAll('.level').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));newGame()}));document.querySelector('#restart').addEventListener('click',newGame);document.querySelector('#again').addEventListener('click',newGame);newGame();
</script></body></html>
